#Minecraft server properties
accepts-transfers=false
# Create contraptions, elevators and trains move players vertically in ways
# the vanilla anti-flight check cannot account for. It does not grant flight;
# it only stops false-positive "Flying is not enabled" kicks. There is no
# anti-cheat in this pack, and the real protections are claims and AntiXray.
allow-flight=true
allow-nether=true
broadcast-console-to-ops=true
broadcast-rcon-to-ops=true
bug-report-link=
difficulty=easy
enable-command-block=false
enable-jmx-monitoring=false
enable-query=false
enable-rcon=false
enable-status=true
# The pack ships No Chat Reports on both sides. Requiring signed profiles
# would stop clients that opt out of signing from chatting, which is the
# whole point of the mod. The server also converts player chat to system
# messages, so there is nothing reportable to sign.
enforce-secure-profile=false
enforce-whitelist=@WHITELIST@
entity-broadcast-range-percentage=100
force-gamemode=false
function-permission-level=2
gamemode=survival
generate-structures=@GENERATE_STRUCTURES@
generator-settings=@GENERATOR_SETTINGS@
hardcore=false
hide-online-players=false
initial-disabled-packs=
initial-enabled-packs=vanilla
level-name=@LEVEL_NAME@
level-seed=
level-type=@LEVEL_TYPE@
log-ips=true
max-chained-neighbor-updates=1000000
max-players=@MAX_PLAYERS@
max-tick-time=60000
max-world-size=29999984
motd=@MOTD@
network-compression-threshold=256
online-mode=true
op-permission-level=4
player-idle-timeout=0
prevent-proxy-connections=false
# This is a PvE server: players fight the game, not each other.
#
# The Open Parties and Claims PvP Support addon is deliberately not in the
# modpack - without it, Open Parties and Claims has no PvP handling of its
# own, so this setting is all that stands between two players and each
# other.
pvp=false
query.port=25565
rate-limit=0
rcon.password=
rcon.port=25575
region-file-compression=deflate
require-resource-pack=false
resource-pack=
resource-pack-id=
resource-pack-prompt=
resource-pack-sha1=
server-ip=
server-port=@SERVER_PORT@
simulation-distance=10
spawn-animals=true
spawn-monsters=true
spawn-npcs=true
spawn-protection=16
sync-chunk-writes=true
text-filtering-config=
use-native-transport=true
view-distance=10
white-list=@WHITELIST@
