# HoneyBeeSMP - the live web map
#
# BlueMap renders the live server's world and serves it on the loopback
# interface. nginx is what the internet actually talks to, so the map gets
# TLS and a real hostname without exposing BlueMap's own port: the host
# firewall drops everything except 22, 80, 443 and the game ports.
#
# Only the live server has a map. The dev server turns BlueMap's web
# server off (minecraft/env/dev/server-overrides) because both servers
# share one network namespace and cannot bind the same port.

server {
    server_name map.honeybeesmp.co.uk;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # BlueMap keeps a websocket open to push map updates.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/map.honeybeesmp.co.uk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/map.honeybeesmp.co.uk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = map.honeybeesmp.co.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name map.honeybeesmp.co.uk;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}