<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HoneyBeeSMP</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 50% 0%, #2a1e00 0%, #0d0a05 55%, #060504 100%);
      color: #f5e6b8;
    }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: clamp(2.5rem, 8vw, 5rem); margin: 0 0 .5rem; letter-spacing: .04em; }
    h1 span { color: #ffc107; }
    p { color: #c9b98a; font-size: 1.15rem; margin: .5rem 0 2rem; }
    a.btn {
      display: inline-block; padding: .9rem 1.8rem; border-radius: 999px;
      background: #ffc107; color: #1a1400; font-weight: 700; text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease;
      box-shadow: 0 0 0 rgba(255,193,7,0);
    }
    a.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,193,7,.25); }
    footer { position: fixed; bottom: 1rem; width: 100%; text-align: center; color: #6f6350; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Honey<span>Bee</span>SMP</h1>
    <p>Our Minecraft community is buzzing. Panel access for staff.</p>
    <a class="btn" href="https://panel.honeybeesmp.co.uk">Panel Login</a>
  </main>
  <footer>&copy; 2026 HoneyBeeSMP</footer>
</body>
</html>
