# HoneyBeeSMP - development environment
#
# Serves the "develop" branch of the repo. This is where new features are
# tried out before they are promoted to the live site.
#
# The live site is honeybeesmp.co.uk; this one is deliberately separate so
# a half-finished change can never be seen by players.

server {
    server_name dev.honeybeesmp.co.uk;

    root /var/www/honeybeesmp.dev;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Note: no "ipv6only=on" here. nginx allows it to be set only once per
    # address:port, and honeybeesmp.co.uk already sets it for [::]:443.
    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/honeybeesmp.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/honeybeesmp.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
