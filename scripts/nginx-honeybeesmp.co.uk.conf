# HoneyBeeSMP - live site
#
# Serves the "main" branch of the repo. The dev site lives in
# dev.honeybeesmp.co.uk.conf and serves the "develop" branch.
#
# The modpack is served from the same root as the site. It is generated by
# scripts/build-modpack.sh during the deploy, so it is always in step with
# the mods the server is actually running.

server {
    server_name honeybeesmp.co.uk www.honeybeesmp.co.uk;

    root /var/www/honeybeesmp.co.uk;
    index index.html;

    location / {
        # $uri.html lets /rules serve rules.html, so the pages can be
        # linked without the extension.
        try_files $uri $uri.html $uri/ =404;
        # Pages change when the site is deployed, and a stale page is worse
        # than a revalidation.
        add_header Cache-Control "no-cache";
    }

    # One address per page. /rules.html used to serve the same content as
    # /rules, which is two copies of a page as far as a crawler is
    # concerned; the canonical link says which one counts, and this makes
    # it true rather than advisory.
    # index.html is deliberately not matched: serving "/" makes an
    # internal request for it, and redirecting that would bounce the home
    # page to itself. Direct requests for /index.html are answered as the
    # canonical link says, which is "/".
    location ~ ^/(?!index\.html$)(.+)\.html$ {
        rewrite ^/(.+)\.html$ /$1 permanent;
    }

    # www serves the same site, so send it to the address the canonical
    # links name instead of answering twice.
    if ($host = www.honeybeesmp.co.uk) {
        return 301 https://honeybeesmp.co.uk$request_uri;
    }

    # Cached for an hour: long enough to save a round trip, short enough
    # that a deploy is picked up without a hard refresh.
    location /assets/ {
        expires 1h;
    }

    # Text compresses well. nginx already compresses html by default.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/honeybeesmp.co.uk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/honeybeesmp.co.uk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Plain HTTP is only ever used to send people to HTTPS.
server {
    if ($host = www.honeybeesmp.co.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = honeybeesmp.co.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name honeybeesmp.co.uk www.honeybeesmp.co.uk;
    return 404; # managed by Certbot
}
