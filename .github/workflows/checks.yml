name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repo sanity checks
        run: sh scripts/check.sh

      - name: Validate shell scripts
        run: |
          for f in scripts/*.sh; do
            sh -n "$f" && echo "ok: $f"
          done
