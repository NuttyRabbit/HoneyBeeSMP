name: deploy

# A push to main updates the LIVE server; a push to develop updates the
# DEV server. The workflow connects to the server over SSH and runs
# scripts/update.sh there, which pulls, checks and deploys.
#
# First-time setup (once per repo):
#   1. Add an SSH private key as a repository secret named DEPLOY_SSH_KEY.
#   2. Add the server's address as DEPLOY_HOST, the user as DEPLOY_USER.
#   3. Add the repo path on the server as DEPLOY_REPO_PATH.
#   Run scripts/install-ci-key.sh on the server to generate the key pair
#   and print the values to paste in.

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy
        required: true
        default: live
        type: choice
        options: [live, dev]

# Two deployments running at once would fight over the server's git
# checkout, so only one runs at a time. The group deliberately does NOT
# include the branch: a push to main and a push to develop must not
# overlap, because both switch the same working copy to a different
# branch.
concurrency:
  group: honeybeesmp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_REPO_PATH: ${{ secrets.DEPLOY_REPO_PATH }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # On a push, develop goes to dev and main goes to live. A manual
          # run uses the chosen environment instead.
          TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'live' || 'dev') }}
        run: |
          set -euo pipefail

          # Fail with a clear message rather than a confusing SSH error.
          missing=""
          for var in DEPLOY_HOST DEPLOY_USER DEPLOY_REPO_PATH SSH_PRIVATE_KEY; do
            if [ -z "${!var:-}" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # The private key is provided as a secret; write it out with the
          # permissions SSH insists on.
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Check the key actually parses. A malformed key (a stray
          # duplicate BEGIN line, a missing END line, a truncated paste)
          # makes SSH fail with exit 255 before it even tries to connect,
          # which is a very confusing way to find out. Catch it here and
          # say what is wrong.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY is not a valid private key."
            echo "::error::It must be the whole block, exactly:"
            echo "::error::  -----BEGIN OPENSSH PRIVATE KEY-----"
            echo "::error::  <base64 lines>"
            echo "::error::  -----END OPENSSH PRIVATE KEY-----"
            echo "::error::Copy it from the file on the server:"
            echo "::error::  sudo cat ~/.ssh/github-actions-deploy"
            exit 1
          fi
          echo "private key OK"

          # Pin the server's host key so we cannot be tricked by a
          # man-in-the-middle.
          #
          # A known_hosts line is: <hostname> <keytype> <key> [comment]
          # The hostname must be there, or SSH cannot match the entry to
          # the host and strict checking fails with "No ED25519 host key
          # is known". If the secret we were given is missing the
          # hostname, add it rather than failing.
          if [ -n "${DEPLOY_SSH_KNOWN_HOSTS:-}" ]; then
            case "$DEPLOY_SSH_KNOWN_HOSTS" in
            "$DEPLOY_HOST"*) echo "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts ;;
            ssh-*|ecdsa-*) echo "$DEPLOY_HOST $DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts ;;
            *) echo "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts ;;
            esac
            echo "using the pinned host key from DEPLOY_SSH_KNOWN_HOSTS"
          else
            echo "::warning::DEPLOY_SSH_KNOWN_HOSTS is not set; discovering the host key instead"
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi

          # Show what we are about to trust, so a mismatch is obvious.
          echo "--- known_hosts ---"
          cat ~/.ssh/known_hosts
          echo "-------------------"

          echo "==> deploying $TARGET_ENV to $DEPLOY_USER@$DEPLOY_HOST"
          set +e
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; cd '$DEPLOY_REPO_PATH'; sh scripts/update.sh '$TARGET_ENV' all"
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            # ssh returns 255 for a connection-level failure, and the
            # remote command's own exit code otherwise. Telling them
            # apart saves a lot of guessing.
            if [ "$rc" -eq 255 ]; then
              echo "::error::Could not connect to $DEPLOY_USER@$DEPLOY_HOST over SSH (exit 255)."
              echo "::error::Check that:"
              echo "::error::  - the server is reachable on port 22 from the runner"
              echo "::error::  - the deploy key is in the server's ~/.ssh/authorized_keys"
              echo "::error::  - the known_hosts entry below matches the server's host key"
            else
              echo "::error::Connected, but the deploy on the server failed (exit $rc)."
              echo "::error::The output above is from the server. Common causes:"
              echo "::error::  - the working copy on the server had local changes that"
              echo "::error::    could not be stashed, so the branch was not switched"
              echo "::error::  - the pull failed (another deploy was running?)"
            fi
            echo "::error::The known_hosts entry in use is printed above."
            exit "$rc"
          fi

          echo "==> deploy finished"
