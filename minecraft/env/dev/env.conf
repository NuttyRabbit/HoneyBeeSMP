# HoneyBeeSMP - development environment
# The DEV server: used for testing new features before they go live.
SERVER_ID=d48afa12-59a5-496e-829a-1ced86d108b5
SERVER_PORT=25565

# The hostname players see in their server list. It must resolve to the
# server, and it is what the panel shows too.
SERVER_ADDRESS=dev.honeybeesmp.co.uk
MC_VERSION=1.21.1
LOADER=neoforge
LOADER_VERSION=21.1.264

# World generation.
#
# The dev world is a superflat: bedrock, dirt, dirt, grass, with no
# features and no structures. That makes it a clean canvas for testing
# builds and mechanics, and it generates instantly, so a broken test does
# not cost you a long wait.
#
# These are read once, when the world is first created. Changing them
# later does not alter an existing world - see the note in
# minecraft/server.properties.
LEVEL_NAME=world
LEVEL_TYPE=minecraft\:flat
GENERATOR_SETTINGS={"biome":"minecraft:plains","layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}]}
GENERATE_STRUCTURES=false
