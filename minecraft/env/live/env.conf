# HoneyBeeSMP - production environment
# The LIVE server: real players, real worlds.
SERVER_ID=119045e1-1fac-41a0-83c0-5e2d85ce4c78
SERVER_PORT=25566

# The public address players connect to. It is recorded here for
# reference only: it is deliberately NOT written to server-ip, because the
# server sits behind NAT and in a Docker container, so the public name
# does not resolve to an address the server can bind to. server-ip stays
# empty, which binds to every interface.
SERVER_ADDRESS=play.honeybeesmp.co.uk
MC_VERSION=1.21.1
LOADER=neoforge
LOADER_VERSION=21.1.264

# The live server is open to everyone. Turning this on would lock out
# every player who is not on minecraft/env/live/whitelist.txt.
WHITELIST=false

# How many players can be on at once. This is also what the Modrinth
# listing says, so the two cannot disagree.
MAX_PLAYERS=20

# The line shown under the server's name in the server list.
MOTD=Create, automation and factory building

# World generation.
#
# The live world is ordinary overworld terrain with structures. This is
# read once, when the world is first created, so changing it later does
# not alter the existing world.
LEVEL_NAME=world
LEVEL_TYPE=minecraft\:normal
GENERATOR_SETTINGS={}
GENERATE_STRUCTURES=true
