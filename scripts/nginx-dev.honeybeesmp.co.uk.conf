# HoneyBeeSMP - development environment
#
# Serves the "develop" branch of the repo. The live site lives in
# nginx-honeybeesmp.co.uk.conf and serves the "main" branch.
#
# The dev site is deliberately separate so a half-finished change can
# never be seen by players.

server {
    server_name dev.honeybeesmp.co.uk;

    root /var/www/honeybeesmp.dev;
    index index.html;

    location / {
        # $uri.html lets /rules serve rules.html, so the pages can be
        # linked without the extension.
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
        # Dev is a preview of the same pages, so keep it out of search
        # results entirely. This has to sit in the location, not the
        # server: a location that sets any header stops inheriting the
        # server's.
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # One address per page, as on the live site: /rules.html redirects to
    # /rules rather than serving a second copy.
    # index.html is deliberately not matched: serving "/" makes an
    # internal request for it, and redirecting that would bounce the home
    # page to itself. Direct requests for /index.html are answered as the
    # canonical link says, which is "/".
    location ~ ^/(?!index\.html$)(.+)\.html$ {
        rewrite ^/(.+)\.html$ /$1 permanent;
    }

    location /assets/ {
        expires 1h;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Note: no "ipv6only=on" here. nginx allows it to be set only once per
    # address:port, and honeybeesmp.co.uk already sets it for [::]:443.
    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/honeybeesmp.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/honeybeesmp.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Plain HTTP is only ever used to send people to HTTPS.
server {
    if ($host = dev.honeybeesmp.co.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name dev.honeybeesmp.co.uk;
    return 404; # managed by Certbot
}
