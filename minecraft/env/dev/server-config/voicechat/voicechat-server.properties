# Simple Voice Chat — server settings.
#
# The dev server and the live server run in the same container, so they
# share a network namespace and cannot have the same UDP port. The live
# server keeps the default, 24454, which is what the client expects, and
# the dev server is moved off it so that the two can both run.
#
# Without this the dev server refuses to start at all: the voice chat
# server cannot bind, and it takes the whole Minecraft server down with
# it.

port=24455
